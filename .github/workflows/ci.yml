name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  flutter-check:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Pigeon Code Generation
        run: dart run tool/generate_pigeon.dart --check

      - name: Analyze Plugin Code
        run: flutter analyze

      - name: Run Plugin Tests
        run: flutter test

      - name: Analyze Example Code
        run: |
          cd example
          flutter pub get
          flutter analyze
          flutter test
